<!DOCTYPE html>
<html>
    <head>
        <title>sign up</title>
        <style>
            h1 {
  text-align: center;
}
h2 {
	text-align: center;
  font-family: sans-serif;
  font-weight: 600;
}
body {
  background: linear-gradient(135deg, pink, orange);
  display: grid;
  min-height: 100vh;
  place-items: center;
}
form {
  background: linear-gradient(135deg, yellow, cyan);
  /*height: 0px auto;
  width: 0px auto;*/
  align-content: center;
  /*text-align: center;*/
  font-family: impact;
  padding: 20px;
  border: solid black;
  border-radius: 25px;
  transition: transform 0.3s ease;
}
form:hover {
  transform: perspective(1000px) rotateX(6deg) rotateY(6deg) scale(1.03);
}
form input[type="reset"] {
  background: green;
  color: black;
  font-weight: 200;
  padding: 6px 40px;
  margin-right: 12px;
  border-radius: 12px;
  cursor: pointer;
  margin: 30px;
  margin-left: 60px;
}


form input[type="submit"] {
  background: green;
  color: black;
  font-weight: 200;
  padding: 6px 40px;
  margin-right: 12px;
  border-radius: 12px;
  cursor: pointer;
}
form [placeholder] {
  padding: 6px;
  width: 95%;
  border-radius: 8px;
  margin-left: 4px;
	margin-top: 8px; 
  font-family: lucida;
}
form label {
  font-size: 15px;
  text-decoration: underline;
}
img {
    display: block;
    border-radius: 5000px;
    max-width: 30%;
    margin: 0px auto;
}
select {
    margin-left: 6px;
    padding: 4px;
}
        </style>
    </head>

    <body>
        <h1>SIGN UP</h1>
<form>
    <img src="pfp.jpg" alt="profile">
  <h2>REGISTRATION FORM</h2>

  <label for="name">Full name: </label><br>
  <input type="text" id="name" placeholder="full name" required autofocus><br><br>

  <label for="user">Username: </label><br>
  <input type="text" id="user" placeholder="enter username" required><br><br>
  
  <label for="pass">Password: </label><br>
  <input type="password" id="pass" placeholder="password" required><br><br>
  
  <label for="Con pass">Confirm Password: </label><br>
  <input type="password" id="Con pass" placeholder="confirm password" required><br><br>
  
  <label for="gmail">G-mail: </label><br>
  <input type="email" id="gmail" placeholder="example@gmail.com" required><br><br>
  
  <label>Gender: </label>
  <input type="radio" id="male" name="gender" value="male" required>
  <label for="male">Male</label>
  
  <input type="radio" id="female" name="gender" value="female">
  <label for="female">Female</label><br><br> 
  
  <label>Country: </label>
  <select>
    <option>India </option>
    <option>Japan </option>
    <option>South Korea </option>
    <option>Portugal </option>
    <option>France </option>
  </select>
  <br><br>
  <input type="reset">
  <input type="submit">
</form>
    </body>
    
</html>
